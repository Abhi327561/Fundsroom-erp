# Render Blueprint — one-click backend deploy.
# Render Dashboard → New → Blueprint → select Fundsroom-erp repo.
# Fill DATABASE_URL in the dashboard when prompted (Render generates JWT_SECRET).
services:
  - type: web
    name: fundsroom-erp-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://fundsroom-erp-ruddy.vercel.app
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
